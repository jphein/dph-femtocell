# GitHub Pages configuration.
#
# This file does NOT enable Pages. Enabling it is a deliberate act in the
# repository settings (Settings -> Pages -> Build from a branch -> main, / root),
# and that is the owner's decision, not this file's.
#
# NOTHING HERE HAS BEEN BUILT. This repository has no remote, so the site has
# never been rendered even once. What follows is the documented default layout
# for a Jekyll site served from a repository root. Treat it as a starting point
# that wants one verification pass the first time Pages is switched on.
#
# WHAT HAS been checked locally, without a build -- each with a positive control
# confirming the check would catch a planted instance:
#   - this file parses as YAML and declares no theme
#   - no Markdown page begins with a "---" line, which Jekyll would otherwise
#     read as front matter and swallow
#   - no page contains Liquid delimiters (double-brace, or brace-percent).
#     Jekyll runs Liquid BEFORE Markdown, so those are live even inside code
#     fences, and this repo is mostly code fences
#   - every relative link and #anchor resolves (tools/check-links.py)
#
# WHAT HAS NOT: that GitHub's build actually succeeds, and that
# jekyll-relative-links rewrites the .md links as expected. Only a first build
# settles those. In the vocabulary this repo uses on its own claims, the four
# checks above are *measured* and everything else here is *reported*.

title: Reusing retired UMTS femtocells
description: >-
  Field notes on the Cisco DPH-151/153/154 and the ip.access nano3G: what the
  hardware is, how to get a management channel, how to bring a cell up against
  your own core, and the traps that cost us nights.

# Served from the repository ROOT, so README.md becomes the landing page and the
# guides under docs/ keep the relative links they already use.
#
# This rests on one assumption: GitHub Pages enables jekyll-relative-links by
# default, which rewrites docs/TRAPS.md -> docs/TRAPS.html so that links written
# for in-repo browsing keep working on the site. If links 404 after the first
# build, check that before changing anything else -- it is the load-bearing part.

# ---------------------------------------------------------------------------
# THEME -- chosen, not defaulted. The alternatives are kept below so the next
# reader can see there was a choice.
# ---------------------------------------------------------------------------
# These pages are mostly wide tables and long code blocks, and primer is
# GitHub's own documentation styling, so it is the closest structural fit of
# the built-ins. With no theme at all the pages still render -- plain, unstyled,
# readable, no navigation -- which was the alternative considered.
theme: jekyll-theme-primer

# Considered and not taken:
#
# (no theme)                     # renders unstyled but readable; a legitimate
#                                # place to stop, and what this file shipped
#                                # with before the choice was made.
# theme: jekyll-theme-minimal    # narrow column with a sidebar; poorer on tables
# theme: jekyll-theme-cayman     # large header band, centred narrow column
#
# These pages lean on wide tables, long code blocks and emoji callouts, so
# primer is the best structural fit. But a theme is a look, and picking a look
# is not a documentation decision.

# Keep the site's rendering identical to what GitHub shows in-repo, so a page
# that reads correctly in the repository reads correctly on the site.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# In the repository but not part of the published site. Nothing in the docs
# links to these, so excluding them breaks no navigation -- checked with
# tools/check-links.py.
exclude:
  - tools/
  - LICENSE
  - LICENSE-DOCS
  - CONTRIBUTING.md
  - SECURITY.md
